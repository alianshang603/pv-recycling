name: Refresh prices.json

# 触发：每 15 分钟跑一次 + 手动触发
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# 注意：cron schedule 在 fork 仓库会被禁用；在私仓 inactive 60 天后也会暂停
# 公网公开仓库正常使用即可

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    concurrency:
      group: refresh-prices
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Fetch prices and write prices.json
        run: |
          node -e "
            const https = require('https');
            const fs = require('fs');
            // 关键：用 82.push2 子域名而非根域名。
            // 根域名 push2.eastmoney.com 会对部分 IP（如 GitHub Actions 的 Azure US）
            // 做 302 负载均衡跳转到 82.push2/79.push2 等子域名。Node.js 默认不跟随重定向，
            // 直连子域名既避开跳转，又是 akshare/efinance 等成熟库的事实做法。
            const EM = 'https://82.push2.eastmoney.com/api/qt/ulist.np/get?ut=bd1d9ddb04089700cf9c27f6f7426281&fltt=2&invt=2&secids=113.agm,113.alm,113.cum,113.snm,113.pbm&fields=f12,f14,f2,f18&_=' + Date.now();
            const SINA = 'https://hq.sinajs.cn/list=AG0,CU0,AL0';

            // 合理区间：用于拒绝 Sina 等过期接口返回的远离市场的脏数据
            // （历史教训：Sina AG0 长期返 ~8000，是几年前的快照）
            const SANE = {
              silverCnyKg:    [12000, 35000],
              copperCnyTon:   [40000, 200000],
              aluminumCnyTon: [12000, 35000],
              tinCnyTon:      [150000, 600000],
              leadCnyTon:     [10000, 30000],
            };

            function get(url, headers, redirects = 3) {
              return new Promise((resolve, reject) => {
                const req = https.get(url, {
                  headers: Object.assign({
                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36',
                    'Accept': 'application/json, text/plain, */*',
                    'Accept-Language': 'zh-CN,zh;q=0.9,en;q=0.8',
                  }, headers || {}),
                  timeout: 10000,
                }, res => {
                  // 关键：跟随 301/302/307/308 重定向，最多 3 跳
                  if ([301,302,307,308].includes(res.statusCode) && redirects > 0 && res.headers.location) {
                    res.resume();
                    const next = new URL(res.headers.location, url).href;
                    return resolve(get(next, headers, redirects - 1));
                  }
                  if (res.statusCode !== 200) { res.resume(); return reject(new Error('http ' + res.statusCode)); }
                  const chunks = [];
                  res.on('data', c => chunks.push(c));
                  res.on('end', () => resolve(Buffer.concat(chunks).toString('utf8')));
                });
                req.on('error', reject);
                req.on('timeout', () => { req.destroy(new Error('timeout')); });
              });
            }

            // 全部输出价格做 sanity check，远离合理范围的整体拒掉这次源
            function sanityCheck(out) {
              const bad = [];
              for (const [k, [lo, hi]] of Object.entries(SANE)) {
                if (out[k] != null && (out[k] < lo || out[k] > hi)) {
                  bad.push(k + '=' + out[k] + ' 超出 [' + lo + ',' + hi + ']');
                }
              }
              if (bad.length) throw new Error('sanity failed: ' + bad.join('; '));
            }

            async function tryEastmoney() {
              const txt = await get(EM, { 'Referer': 'https://quote.eastmoney.com/' });
              const json = JSON.parse(txt);
              const diff = (json && json.data && json.data.diff) || [];
              const out = {};
              // 5 个主连虚拟符号一次拉回；前 3 个参与计算，后 2 个 (snm/pbm) 占位备用
              for (const item of diff) {
                const code = String(item.f12 || '').toLowerCase();
                const v = parseFloat(item.f2) || parseFloat(item.f18);
                if (!(v > 0)) continue;
                if (code === 'agm') out.silverCnyKg = v;
                else if (code === 'cum') out.copperCnyTon = v;
                else if (code === 'alm') out.aluminumCnyTon = v;
                else if (code === 'snm') out.tinCnyTon = v;
                else if (code === 'pbm') out.leadCnyTon = v;
              }
              if (!out.silverCnyKg && !out.copperCnyTon && !out.aluminumCnyTon) throw new Error('em empty');
              sanityCheck(out);
              out.source = 'eastmoney-push2';
              return out;
            }
            async function trySina() {
              const txt = await get(SINA, { 'Referer': 'https://finance.sina.com.cn/' });
              const parseLine = l => {
                const p = l.split(',');
                if (p.length < 10) return null;
                for (const i of [8, 9, 2]) {
                  const v = parseFloat(p[i]);
                  if (Number.isFinite(v) && v > 0) return v;
                }
                return null;
              };
              const grab = tag => {
                const m = txt.match(new RegExp('hq_str_' + tag + '\\\\s*=\\\\s*\"([^\"]*)\"'));
                return m ? parseLine(m[1]) : null;
              };
              const ag = grab('AG0'), cu = grab('CU0'), al = grab('AL0');
              if (!ag && !cu && !al) throw new Error('sina empty');
              const out = {};
              if (ag) out.silverCnyKg = ag;
              if (cu) out.copperCnyTon = cu;
              if (al) out.aluminumCnyTon = al;
              sanityCheck(out);
              out.source = 'sina-shfe';
              return out;
            }

            (async () => {
              let out;
              try { out = await tryEastmoney(); }
              catch (e1) {
                console.error('eastmoney failed:', e1.message);
                try { out = await trySina(); }
                catch (e2) {
                  console.error('sina failed:', e2.message);
                  process.exit(1);
                }
              }
              out.updatedAt = new Date().toISOString();
              fs.writeFileSync('prices.json', JSON.stringify(out, null, 2));
              console.log('Wrote prices.json:', out);
            })();
          "

      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet prices.json 2>/dev/null; then
            git add prices.json
            git commit -m "chore: refresh prices.json [skip ci]"
            git push
          else
            echo "prices.json unchanged, skipping commit"
          fi
